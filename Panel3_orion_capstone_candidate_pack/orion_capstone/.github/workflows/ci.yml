name: data-quality-suite

# TODO D3: complete this workflow.
# 1. Run on pull requests that change schemas/, mappings/, tests/ or data/, on pushes to main,
#    nightly after the load window (see handbook S1), and on manual dispatch.
# 2. Check out the repo, set up Python 3.11, install requirements.txt.
# 3. Run pytest and write a JUnit XML report to reports/junit.xml.
# 4. Upload the reports folder as an artifact even when tests fail.
on:
  # TODO
  pull_request:
    paths:
      - "schemas/**"
      - "mappings/**"
      - "tests/**"
      - "data/**"
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: python -m pytest --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
