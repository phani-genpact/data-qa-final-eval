name: data-quality-suite

on:
  pull_request:
    paths:
      - "Panel3_orion_capstone_candidate_pack/orion_capstone/schemas/**"
      - "Panel3_orion_capstone_candidate_pack/orion_capstone/mappings/**"
      - "Panel3_orion_capstone_candidate_pack/orion_capstone/tests/**"
      - "Panel3_orion_capstone_candidate_pack/orion_capstone/data/**"
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: Panel3_orion_capstone_candidate_pack/orion_capstone
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create reports directory
        working-directory: Panel3_orion_capstone_candidate_pack/orion_capstone
        run: mkdir -p reports

      - name: Run tests
        working-directory: Panel3_orion_capstone_candidate_pack/orion_capstone
        run: python -m pytest --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: Panel3_orion_capstone_candidate_pack/orion_capstone/reports/
          if-no-files-found: warn
